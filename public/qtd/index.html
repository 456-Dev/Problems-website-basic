<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question The Day — what should we ask next?</title>
<meta name="description" content="Two hundred questions asked of strangers on the street. Suggest the next one, vote for the ones you want asked, or watch the ones we already did.">
<link rel="icon" type="image/png" sizes="32x32" href="media/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<meta name="theme-color" content="#070707">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Question The Day">
<meta property="og:title" content="What should we ask strangers next?">
<meta property="og:description" content="Two hundred questions asked of strangers on the street. Suggest the next one, or vote for the ones you want asked.">
<meta property="og:url" content="https://456solutions.org/qtd/">
<meta property="og:image" content="https://456solutions.org/qtd/media/og-card.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/home.css">
</head>
<body class="is-home">

<header class="topbar">
  <a class="wordmark" href="./"><i></i>Question The Day</a>
  <nav class="navlinks">
    <a href="./" aria-current="page">Ask</a>
    <a href="episodes/">Episodes</a>
    <a href="map/">Map</a>
    <a href="list/">Index</a>
    <a href="about/">About</a>
  </nav>
</header>

<!-- the people who already answered: every tile is a face from an episode -->
<div class="facewall" id="facewall" aria-hidden="true"></div>
<div class="facetip" id="facetip" hidden></div>

<main class="home">
  <section class="ask" id="ask">
    <p class="ask-kicker label"><b id="neps">200</b> questions asked · <b id="npeople">5,000</b> strangers answered</p>
    <h1 class="ask-h">What should we ask strangers next?</h1>
    <form class="ask-form" id="askform" autocomplete="off">
      <label class="sr" for="askq">Your question</label>
      <input id="askq" type="text" maxlength="200" spellcheck="true"
             placeholder="Type a question for strangers">
      <button class="btn btn-solid" id="askgo" type="submit">Suggest</button>
    </form>
    <p class="ask-hint" id="askhint">Asked already? We’ll take you to the video. Suggested already? It counts as your vote.</p>
    <p class="ask-status" id="askstatus" role="status" aria-live="polite"></p>
  </section>

  <section class="board" aria-labelledby="boardh">
    <div class="board-head">
      <h2 id="boardh">Up next, maybe</h2>
      <div class="board-sort" id="boardsort" role="group" aria-label="Sort suggestions">
        <button class="on" data-sort="top" aria-pressed="true">Most wanted</button>
        <button data-sort="new" aria-pressed="false">Newest</button>
      </div>
    </div>
    <ol class="board-list" id="board" aria-live="polite"></ol>
    <p class="board-empty" id="boardempty" hidden></p>
    <button class="board-more" id="boardmore" type="button" hidden></button>
  </section>

  <a class="today" id="today" href="episodes/" hidden>
    <span class="label">Or answer today’s question</span>
    <span class="today-q" id="todayq"></span>
    <span class="today-go" aria-hidden="true">→</span>
  </a>
</main>

<script type="module" src="src/home.js"></script>
</body>
</html>
