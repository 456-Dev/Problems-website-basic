<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Every episode of Question The Day, sortable by episode and mood, with topics and tags.">
<link rel="icon" type="image/png" sizes="32x32" href="../media/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../media/icon-192.png">
<link rel="apple-touch-icon" href="../media/apple-touch-icon.png">
<meta name="theme-color" content="#070707">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Question The Day">
<meta property="og:title" content="Index — Question The Day">
<meta property="og:description" content="Every episode of Question The Day, sortable by episode and mood, with topics and tags.">
<meta property="og:url" content="https://456solutions.org/qtd/list/">
<meta property="og:image" content="https://456solutions.org/qtd/media/og-card.png">

<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/list.css">
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="../"><i></i>Question The Day</a>
  <nav class="navlinks">
    <a href="../">Ask</a>
    <a href="../episodes/">Episodes</a>
    <a href="../map/">Map</a>
    <a href="./" aria-current="page">Index</a>
    <a href="../about/">About</a>
  </nav>
</header>

<main class="wrap listpage">
  <div class="listhead">
    <h1>Every question</h1>
    <p>Every question, in order. Sort by mood to go from the heaviest to the silliest.</p>
  </div>

  <div class="ticks"></div>

  <div class="toolbar">
    <input id="f" type="text" placeholder="filter: a word, a topic, a place, or an episode number" autocomplete="off">
    <div class="sorts" id="sorts">
      <button class="btn" data-k="n" aria-pressed="true">EPISODE</button>
      <button class="btn" data-k="mood">MOOD</button>
    </div>
  </div>

  <div class="tablewrap">
    <table class="etable">
      <thead>
        <tr><th>EP</th><th>Question</th><th class="hideS">Topic</th><th class="hideS">Mood</th>
            <th>Tag</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="label" id="count"></p>
</main>

<script type="module" src="../src/list.js"></script>
</body>
</html>
