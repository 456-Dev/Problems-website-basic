<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map — Question The Day</title>
<meta name="description" content="Where every question was asked, from New York to Fiji to Rio — and every walk through New York, street by street.">
<link rel="icon" type="image/png" sizes="32x32" href="../media/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../media/icon-192.png">
<link rel="apple-touch-icon" href="../media/apple-touch-icon.png">
<meta name="theme-color" content="#070707">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Question The Day">
<meta property="og:title" content="Map — Question The Day">
<meta property="og:description" content="Where every question was asked, from New York to Fiji to Rio — and every walk through New York, street by street.">
<meta property="og:url" content="https://456solutions.org/qtd/map/">
<meta property="og:image" content="https://456solutions.org/qtd/media/og-card.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/field.css">
<link rel="stylesheet" href="../styles/map.css">
</head>
<body class="is-field">
<header class="topbar">
  <a class="wordmark" href="../"><i></i>Question The Day</a>
  <nav class="navlinks">
    <a href="../">Dial</a>
    <a href="../episodes/">Episodes</a>
    <a href="./" aria-current="page">Map</a>
    <a href="../list/">Index</a>
    <a href="../about/">About</a>
  </nav>
</header>

<main id="stage">
  <canvas id="map" aria-label="Where each episode was filmed"></canvas>

  <!-- the way into New York, pinned to the city on the world view -->
  <button class="nyc-callout" id="nyccall" hidden>
    <span class="label">New York</span>
    <b class="num" id="nycn">—</b>
    <span class="label">episodes</span>
    <span class="go">SEE THE WALKS →</span>
  </button>

  <div class="hud hud-tl">
    <div class="panel">
      <div class="spread">
        <span class="label" id="viewname">The world</span>
        <button class="btn mini" id="back" hidden>← WORLD</button>
        <button class="btn mini" id="fold" aria-expanded="true">PLACES</button>
      </div>
      <div class="places" id="places"></div>
    </div>
  </div>

  <div class="hud hud-bl">
    <div class="panel legend" id="legend"></div>
  </div>

  <div class="hud hud-tr">
    <div class="panel zoomer">
      <button class="btn" id="zin" aria-label="Zoom in">+</button>
      <button class="btn" id="zout" aria-label="Zoom out">&minus;</button>
      <button class="btn" id="zfit" aria-label="Reset the view">FIT</button>
    </div>
  </div>

  <div id="tip" class="tip" hidden></div>
  <div id="loading" class="loading label">Loading the map…</div>
</main>
<script type="module" src="../src/map.js"></script>
</body>
</html>
