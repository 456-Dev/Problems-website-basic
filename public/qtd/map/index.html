<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map — Question The Day</title>
<meta name="description" content="A globe of every place Question The Day stopped strangers: spin it, and the questions asked there drift up.">
<link rel="icon" type="image/png" sizes="32x32" href="../media/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../media/icon-192.png">
<link rel="apple-touch-icon" href="../media/apple-touch-icon.png">
<meta name="theme-color" content="#070707">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Question The Day">
<meta property="og:title" content="Map — Question The Day">
<meta property="og:description" content="Where every question was asked, from New York to Fiji to Rio — and every walk through New York, street by street.">
<meta property="og:url" content="https://456solutions.org/qtd/map/">
<meta property="og:image" content="https://456solutions.org/qtd/media/og-card.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/globe.css">
<script src="../vendor/d3-array.min.js"></script>
<script src="../vendor/d3-geo.min.js"></script>
</head>
<body class="is-globe">
<header class="topbar">
  <a class="wordmark" href="../"><i></i>Question The Day</a>
  <nav class="navlinks">
    <a href="../">Ask</a>
    <a href="../episodes/">Episodes</a>
    <a href="./" aria-current="page">Map</a>
    <a href="../list/">Index</a>
    <a href="../about/">About</a>
  </nav>
</header>

<main class="globe-stage" id="stage">
  <canvas id="globe" aria-label="A globe of every place an episode was filmed. Drag to spin it."></canvas>
  <!-- questions asked near what you're looking at drift in here, each with an arrow to its place -->
  <svg class="leaders" id="leaders" aria-hidden="true"></svg>
  <div class="ghosts" id="ghosts"></div>

  <div class="gpanel" id="gpanel">
    <div class="gpanel-head">
      <span class="label" id="viewname">The world</span>
      <button class="btn mini" id="back" hidden>← Globe</button>
      <button class="btn mini" id="fold" aria-expanded="false">Places</button>
    </div>
    <div class="places" id="places" hidden></div>
  </div>

  <div class="gzoom">
    <button class="btn" id="zin" aria-label="Zoom in">+</button>
    <button class="btn" id="zout" aria-label="Zoom out">&minus;</button>
    <button class="btn" id="zfit" aria-label="Back to the whole globe">&#9711;</button>
  </div>

  <p class="ghint label" id="ghint">Drag to spin · scroll or pinch to zoom · click a face</p>
  <div class="gtip" id="gtip" hidden></div>
  <div class="gloading label" id="gloading">Spinning up the globe…</div>
</main>

<script type="module" src="../src/globe.js"></script>
</body>
</html>
